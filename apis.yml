aid: txt
name: .txt
description: >-
  .txt (dottxt) is the structured-generation company behind the open-source
  Outlines library (65M+ downloads). Its hosted platform, the dottxt API at
  api.dottxt.ai, is an OpenAI-compatible pay-per-token API whose defining
  contract is schema enforcement: a JSON Schema passed in response_format is
  compiled and enforced by constrained decoding, so model outputs are
  guaranteed valid — including field-by-field RFC 6902 JSON Patch streaming,
  Open Responses support, embeddings, and JSONL batch processing. Founded by
  the Outlines maintainers and backed by Seedcamp; inference is operated with
  launch partner Doubleword.
